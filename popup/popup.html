<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tiny reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="22" height="22">
    <h1>tiny reader</h1>
  </header>

  <section id="idle">
    <button id="readSelection" class="primary" type="button">Read selection</button>
    <button id="readPage" type="button">Read whole page</button>
    <p id="selectionHint" class="muted">Select text on the page, then it is read exactly that.</p>
  </section>

  <section id="transport" hidden>
    <div class="row">
      <button id="prev" type="button" title="Previous sentence" aria-label="Previous sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6zM20 5.6v12.8L9.8 12z"/></svg></button>
      <button id="playPause" class="primary" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5h3.4v14H6.5zM14.1 5h3.4v14h-3.4z"/></svg><span>Pause</span></button>
      <button id="next" type="button" title="Next sentence" aria-label="Next sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2zM4 5.6v12.8L14.2 12z"/></svg></button>
      <button id="stop" type="button" title="Stop" aria-label="Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    </div>
    <p id="progress" class="muted">Preparing…</p>
    <p id="preview"></p>
  </section>

  <section id="workspace">
    <button id="openReader" type="button">Open reader workspace</button>
  </section>

  <section id="settings">
    <label>Voice
      <select id="voice">
        <option value="M2">M2 (male)</option>
        <option value="F2">F2 (female)</option>
      </select>
    </label>
    <label>Speed
      <span class="slider-row">
        <input id="speed" type="range" min="0.5" max="2.5" step="0.25" value="1">
        <output id="speedValue" for="speed">1×</output>
      </span>
    </label>
  </section>

  <p id="status" role="status"></p>

  <script src="popup.js"></script>
</body>
</html>
