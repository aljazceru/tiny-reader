<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tiny reader</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="32" height="32">
    <div>
      <h1>tiny reader</h1>
      <p class="muted">Read the web aloud — locally, or via your own TTS endpoint.</p>
    </div>
  </header>

  <main>
    <section id="sources" aria-labelledby="sourcesHeading">
      <h2 id="sourcesHeading">Read something</h2>

      <div class="field">
        <label for="pasteText">Paste text <span class="muted">(Ctrl+Enter reads it)</span></label>
        <textarea id="pasteText" rows="8" spellcheck="false"
          placeholder="Paste or type English text here, then press Read."></textarea>
        <button id="readPaste" class="primary" type="button">Read pasted text</button>
      </div>

      <div class="field">
        <label for="urlInput">Web page URL</label>
        <div class="row">
          <input id="urlInput" type="url" inputmode="url" placeholder="https://example.com/article">
          <button id="readUrl" type="button">Read page</button>
        </div>
      </div>

      <div class="field">
        <label for="fileInput">Open a file <span class="muted">(txt, html, pdf or epub)</span></label>
        <input id="fileInput" type="file"
          accept=".txt,.html,.htm,.pdf,.epub,text/plain,text/html,application/pdf,application/epub+zip">
      </div>
    </section>

    <section id="transport" aria-label="Playback">
      <div class="row controls">
        <button id="prev" class="icon" type="button" title="Previous sentence" aria-label="Previous sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.2v14H6zM20 5.6v12.8L9.8 12z"/></svg></button>
        <button id="playPause" class="primary" type="button" aria-label="Pause or resume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5h3.4v14H6.5zM14.1 5h3.4v14h-3.4z"/></svg><span>Pause</span></button>
        <button id="next" class="icon" type="button" title="Next sentence" aria-label="Next sentence"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 5H18v14h-2.2zM4 5.6v12.8L14.2 12z"/></svg></button>
        <button id="stop" class="icon" type="button" title="Stop reading" aria-label="Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <button id="readAgain" type="button" title="Read the last text again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.3 4H3.2L7 4.8 10.8 9H8a5 5 0 1 0 4-2z"/></svg> Read again</button>
        <button id="saveCurrent" type="button" title="Save the current text to the library">Save to library</button>
      </div>
      <p id="progress" class="muted">Nothing is being read.</p>
      <p id="preview"></p>
    </section>

    <section id="settings" aria-label="Voice settings">
      <label for="voice">Voice
        <select id="voice">
          <option value="" disabled selected>Loading voices…</option>
        </select>
      </label>
      <label for="speed">Speed
        <span class="slider-row">
          <input id="speed" type="range" min="0.5" max="2.5" step="0.25" value="1">
          <output id="speedValue" for="speed">1×</output>
        </span>
      </label>
    </section>

    <p id="status" role="status"></p>

    <section id="library" aria-label="Library"></section>
    <section id="models" aria-label="Voice model"></section>
  </main>

  <script src="../vendor/readability.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
